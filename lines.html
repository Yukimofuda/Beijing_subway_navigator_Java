<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地铁线路选择</title>
  <link rel="stylesheet" href="style/styles.css">
</head>
<body style="background-image: url('lines.png');">
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="brand-title">查看列车时刻表</div>
        <div class="brand-subtitle">先选择线路，再选择车次</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <a class="btn btn-ghost" href="timetable.html">日历式查看</a>
        <a class="btn btn-ghost" href="index.html">返回首页</a>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h1 class="title">选择地铁线路</h1>
        <p class="subtitle">线路列表来自时刻表分片数据（自动合并加载）。</p>
        <div id="lines" class="list" style="margin-top:16px;"></div>
      </div>
    </div>
  </div>

  <script defer src="src/ui.js"></script>
  <script defer src="src/timetableLoader.js"></script>
  <script defer src="src/lines.js"></script>
</body>
</html>
