<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地铁线路选择</title>
  <link rel="stylesheet" href="style/styles.css">
  <link rel="stylesheet" href="style/product-apple.css">
</head>
<body style="background-image: url('lines.png');">
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="brand-title">时刻表</div>
        <div class="brand-subtitle">线路 · 方向 · 车次</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <a class="btn btn-ghost" href="timetable.html">日历式查看</a>
        <a class="btn btn-ghost" href="index.html">返回首页</a>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="transit-page-heading">
          <span class="transit-heading-symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="17"/><path d="M24 13v12l8 5"/></svg></span>
          <div><span class="section-kicker">TRAIN TIMETABLES</span><h1 class="title">列车时刻</h1></div>
          <div class="transit-heading-caption"><span>线路</span><span class="transit-heading-track" aria-hidden="true"></span><span>车次</span></div>
        </div>
        <div id="lines" class="line-catalog-grid" style="margin-top:16px;"></div>
      </div>
    </div>
  </div>

  <script defer src="src/ui.js"></script>
  <script defer src="src/transitApi.js"></script>
  <script defer src="src/transitData.js"></script>
  <script defer src="src/timetableLoader.js"></script>
  <script defer src="src/lines.js"></script>
</body>
</html>
