<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线路查询</title>
    <link rel="stylesheet" href="style/styles.css">
</head>
<body style="background-image: url('index_background.png');">
    <div class="page">
        <div class="topbar">
            <div class="brand">
                <div class="brand-title">线路查询</div>
                <div class="brand-subtitle">支持最短时间 / 最少换乘</div>
            </div>
            <div class="topbar-actions">
                <div class="pill">当前时间：<span id="current-time">--:--</span></div>
                <div class="pill" id="data-status">数据加载中</div>
                <a class="btn btn-ghost" href="index.html">返回首页</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="page-heading">
                    <span class="section-kicker">行程规划</span>
                    <h1 class="title">选择起终点</h1>
                    <p class="subtitle">可先选线路缩小范围，也可直接输入中文站名或拼音首字母。</p>
                </div>

                <div class="journey-planner" style="margin-top:18px;">
                    <section class="journey-card station-picker" data-picker="start">
                        <div class="field line-field">
                            <div class="label">出发线路</div>
                            <select class="input station-line-select" id="start-line-select"></select>
                            <input class="input line-summary" id="start-line-summary" type="text" readonly hidden>
                        </div>
                        <div class="field combo-field">
                            <div class="label">出发站点</div>
                            <div class="combo-shell">
                                <input class="input station-search" type="text" id="start-station" placeholder="先选线路或直接输入站点" autocomplete="off" required>
                                <div class="combo-menu" id="start-station-menu" role="listbox"></div>
                            </div>
                        </div>
                    </section>
                    <section class="journey-card station-picker" data-picker="end">
                        <div class="field line-field">
                            <div class="label">目的线路</div>
                            <select class="input station-line-select" id="end-line-select"></select>
                            <input class="input line-summary" id="end-line-summary" type="text" readonly hidden>
                        </div>
                        <div class="field combo-field">
                            <div class="label">目的站点</div>
                            <div class="combo-shell">
                                <input class="input station-search" type="text" id="end-station" placeholder="先选线路或直接输入站点" autocomplete="off" required>
                                <div class="combo-menu" id="end-station-menu" role="listbox"></div>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="preference-bar" style="margin-top:16px;">
                    <button class="btn btn-ghost btn-toggle is-selected" id="btn-shortest" type="button" onclick="setTravelRequirement('shortestTime')">最短时间</button>
                    <button class="btn btn-ghost btn-toggle" id="btn-transfers" type="button" onclick="setTravelRequirement('leastTransfers')">最少换乘</button>
                    <button class="btn btn-ghost" id="swap-route" type="button" onclick="swapRouteEndpoints()">交换起终点</button>
                    <button class="btn btn-primary" id="query-button" type="button" onclick="getRoute()" disabled>查询路线</button>
                    <a class="btn" href="Map.html">打开线路图</a>
                </div>

                <div id="result" style="margin-top:16px;">
                    <div class="empty-state route-empty-state">
                        <div class="empty-state-mark" aria-hidden="true"></div>
                        <h2>选择起点和终点，开始规划路线</h2>
                        <p>查询结果将显示预计到达、票价、换乘与完整沿途站点。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script defer src="src/ui.js"></script>
    <script defer src="src/transitApi.js"></script>
    <script defer src="src/timetableLoader.js"></script>
    <script defer src="src/transitData.js"></script>
    <script defer src="src/query.js"></script>
    <script defer src="src/lineManagement.js"></script>
</body>
</html>
