<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北京地铁出行</title>
    <link rel="stylesheet" href="style/styles.css">
    <link rel="stylesheet" href="style/product-apple.css">
</head>
<body style="background-image: url('index_background.png');">
    <div class="page home-page">
        <header class="topbar">
            <div class="brand">
                <div class="brand-title">北京地铁</div>
                <div class="brand-subtitle">出行服务</div>
            </div>
            <div class="topbar-actions">
                <span class="status-chip" id="home-data-mode">正在准备</span>
            </div>
        </header>

        <main class="product-home">
            <section class="home-planner card" aria-labelledby="home-planner-title">
                <div class="home-planner-head">
                    <div>
                        <span class="section-kicker">北京地铁</span>
                        <h1 id="home-planner-title">规划行程</h1>
                    </div>
                    <div class="home-clock" aria-label="当前时间">
                        <strong id="home-current-time">--:--</strong>
                        <span id="home-day-type">--</span>
                    </div>
                </div>

                <div class="journey-planner home-journey-planner">
                    <section class="journey-card station-picker" data-picker="home-start">
                        <div class="field line-field">
                            <label class="label" for="home-start-line">出发线路</label>
                            <select class="input" id="home-start-line"></select>
                            <input class="input line-summary" id="home-start-line-summary" type="text" readonly hidden>
                        </div>
                        <div class="field combo-field">
                            <label class="label" for="home-start">出发站</label>
                            <div class="combo-shell">
                                <input class="input" id="home-start" placeholder="查找出发站" autocomplete="off">
                                <div class="combo-menu" id="home-start-menu" role="listbox"></div>
                            </div>
                        </div>
                    </section>

                    <section class="journey-card station-picker" data-picker="home-end">
                        <div class="field line-field">
                            <label class="label" for="home-end-line">目的线路</label>
                            <select class="input" id="home-end-line"></select>
                            <input class="input line-summary" id="home-end-line-summary" type="text" readonly hidden>
                        </div>
                        <div class="field combo-field">
                            <label class="label" for="home-end">目的站</label>
                            <div class="combo-shell">
                                <input class="input" id="home-end" placeholder="查找目的站" autocomplete="off">
                                <div class="combo-menu" id="home-end-menu" role="listbox"></div>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="home-planner-footer">
                    <div class="segmented-control" aria-label="路线偏好">
                        <button class="segment-button is-selected" type="button" data-home-mode="shortestTime">更快到达</button>
                        <button class="segment-button" type="button" data-home-mode="leastTransfers">少换乘</button>
                    </div>
                    <div class="home-actions">
                        <button class="btn btn-ghost" id="home-swap" type="button">交换</button>
                        <button class="btn btn-primary" id="home-submit" type="button" disabled>查看路线</button>
                    </div>
                </div>
                <p class="form-message" id="home-form-message" aria-live="polite">正在载入站点</p>
            </section>

            <aside class="home-network card" aria-labelledby="network-title">
                <div class="home-network-head">
                    <div>
                        <span class="section-kicker">现在出发</span>
                        <h2 id="network-title">下一班车</h2>
                    </div>
                    <span class="live-indicator"><span></span>时刻表可用</span>
                </div>
                <div class="network-metrics">
                    <div class="network-metric"><strong id="home-station-count">--</strong><span>座车站</span></div>
                    <div class="network-metric"><strong id="home-line-count">--</strong><span>条线路</span></div>
                    <div class="network-metric"><strong>2</strong><span>种日期</span></div>
                </div>
                <section class="home-live-board" aria-labelledby="home-live-title">
                    <div class="home-live-board-head">
                        <div>
                            <span>出发站</span>
                            <strong id="home-live-title">选择出发站</strong>
                        </div>
                        <span id="home-live-clock">当前时刻</span>
                    </div>
                    <div class="home-departures" id="home-live-departures" aria-live="polite">
                        <div class="home-departure-empty">选择出发站后显示近期列车。</div>
                    </div>
                </section>
                <div class="service-links">
                    <a href="service_board.html"><span>首末班与线路状态</span><strong>今日运营</strong></a>
                    <a href="Map.html"><span>查找线路与车站</span><strong>打开线路图</strong></a>
                </div>
                <p class="data-updated" id="home-updated">正在载入时刻表</p>
            </aside>

            <section class="home-task-grid" aria-label="常用出行工具">
                <a class="task-card task-card-map" href="Map.html">
                    <span class="task-card-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 7l7-3 8 3 7-3v21l-7 3-8-3-7 3z"/><path d="M12 4v21M20 7v21"/></svg></span>
                    <div><strong>线路图</strong><span>查找车站、线路与下一班车</span></div>
                    <span class="task-card-arrow" aria-hidden="true">→</span>
                </a>
                <a class="task-card" href="fare_calculator.html">
                    <span class="task-card-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="4" y="7" width="24" height="18" rx="3"/><path d="M4 13h24M9 19h6"/></svg></span>
                    <div><strong>票价</strong><span>估算车费、距离与换乘</span></div>
                    <span class="task-card-arrow" aria-hidden="true">→</span>
                </a>
                <a class="task-card" href="station_guide.html">
                    <span class="task-card-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M25 14c0 7-9 14-9 14S7 21 7 14a9 9 0 1118 0z"/><circle cx="16" cy="14" r="3"/></svg></span>
                    <div><strong>站点导览</strong><span>查看换乘、相邻站与设施</span></div>
                    <span class="task-card-arrow" aria-hidden="true">→</span>
                </a>
                <a class="task-card" href="lines.html">
                    <span class="task-card-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><path d="M16 9v8l5 3"/></svg></span>
                    <div><strong>时刻表</strong><span>按线路与方向查找车次</span></div>
                    <span class="task-card-arrow" aria-hidden="true">→</span>
                </a>
            </section>

            <section class="home-recent card">
                <div class="section-heading-row">
                    <div><span class="section-kicker">最近使用</span><h2>最近行程</h2></div>
                    <a class="text-link" href="query.html">规划新行程</a>
                </div>
                <div id="home-recent-routes" class="recent-route-list">
                    <div class="compact-empty">查询过的路线会保存在这里。</div>
                </div>
            </section>
        </main>
    </div>

    <script defer src="src/ui.js"></script>
    <script defer src="src/transitApi.js"></script>
    <script defer src="src/timetableLoader.js"></script>
    <script defer src="src/transitData.js"></script>
    <script defer src="src/home.js"></script>
</body>
</html>
