<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北京地铁查询系统</title>
    <link rel="stylesheet" href="style/styles.css">
</head>
<body style="background-image: url('index_background.png');">
    <div class="page">
        <div class="topbar">
            <div class="brand">
                <div class="brand-title">北京地铁查询系统</div>
                <div class="brand-subtitle">线路查询 · 时刻表 · 站点信息 · 线路图</div>
            </div>
        </div>

        <div class="home-layout">
            <section class="home-hero">
                <div>
                    <div class="pill">Beijing Subway Navigator</div>
                    <h1 class="title" style="margin-top:16px;">把路线、时刻与站点信息放在一个清晰工作台里。</h1>
                    <p class="subtitle">入口按真实出行任务组织，不再是线性按钮清单；优先呈现查询、地图、运行状态与站点服务。</p>
                </div>
                <div class="home-actions">
                    <a class="btn btn-primary" href="query.html">开始规划路线</a>
                    <a class="btn btn-ghost" href="Map.html">打开线路图</a>
                </div>
            </section>

            <section class="route-cluster" aria-label="功能入口">
                <a class="route-tile tile-large" href="query.html" style="--tile-image:url('index_background.png');">
                    <span class="tile-visual" aria-hidden="true"></span>
                    <strong>线路查询</strong>
                    <span>最短时间 / 最少换乘 / 票价联动</span>
                </a>
                <a class="route-tile tile-wide" href="Map.html" style="--tile-image:url('Beijing_Subway_System_Map.svg');">
                    <span class="tile-visual" aria-hidden="true"></span>
                    <strong>交互线路图</strong>
                    <span>拖拽缩放，悬浮查看站点下一班车</span>
                </a>
                <a class="route-tile tile-small" href="service_board.html" style="--tile-image:url('lines.png');">
                    <span class="tile-visual" aria-hidden="true"></span>
                    <strong>运行看板</strong>
                    <span>线路状态与首末班概览</span>
                </a>
                <a class="route-tile tile-small" href="fare_calculator.html" style="--tile-image:url('index2_background.png');">
                    <span class="tile-visual" aria-hidden="true"></span>
                    <strong>票价测算</strong>
                    <span>距离、费用与路径拆解</span>
                </a>
                <a class="route-tile tile-small" href="station_guide.html" style="--tile-image:url('station.png');">
                    <span class="tile-visual" aria-hidden="true"></span>
                    <strong>站点导览</strong>
                    <span>换乘、相邻站与到站信息</span>
                </a>
                <a class="route-tile tile-wide" href="lines.html" id="timetable-button" style="--tile-image:url('lines.png');">
                    <span class="tile-visual" aria-hidden="true"></span>
                    <strong>列车时刻表</strong>
                    <span>按线路进入车次与方向</span>
                </a>
                <a class="route-tile tile-wide" href="stations.html" style="--tile-image:url('station.png');">
                    <span class="tile-visual" aria-hidden="true"></span>
                    <strong>站点详细信息</strong>
                    <span>从站点数据中浏览所有节点</span>
                </a>
            </section>
        </div>
    </div>

    <script defer src="src/ui.js"></script>
    <script defer src="src/app.js"></script>
</body>
</html>
