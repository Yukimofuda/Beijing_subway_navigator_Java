<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>票价与距离测算</title>
    <link rel="stylesheet" href="style/styles.css">
    <style>
        .tool-grid {
            width: min(1120px, 100%);
            display: grid;
            grid-template-columns: 390px minmax(0, 1fr);
            gap: 14px;
        }

        .tool-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .tool-panel-body {
            padding: 16px;
        }

        .fare-result {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .fare-card {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            padding: 12px;
        }

        .fare-value {
            font-size: 28px;
            font-weight: 500;
        }

        .metric-label {
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .route-steps {
            margin-top: 14px;
            display: grid;
            gap: 8px;
        }

        .route-step {
            display: grid;
            grid-template-columns: 110px 1fr auto;
            gap: 10px;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            padding: 10px 12px;
        }

        @media (max-width: 900px) {
            .tool-grid,
            .fare-result {
                grid-template-columns: 1fr;
            }

            .route-step {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="style/product-apple.css">
</head>
<body style="background-image: url('index_background.png');">
    <div class="page">
        <div class="topbar">
            <div class="brand">
                <div class="brand-title">票价与距离测算</div>
                <div class="brand-subtitle">站点选择 · 路径距离 · 票价估算</div>
            </div>
            <div class="topbar-actions">
                <a class="btn btn-ghost" href="query.html">线路查询</a>
                <a class="btn btn-ghost" href="index.html">返回首页</a>
            </div>
        </div>

        <div class="tool-grid">
            <section class="tool-panel">
                <div class="tool-panel-body">
                    <div class="page-heading fare-page-heading">
                        <span class="section-kicker">票价估算</span>
                        <h1 class="title">计算一次行程</h1>
                        <p class="subtitle">选择起点与终点，查看票价、距离和换乘路径。</p>
                    </div>
                    <section class="journey-card station-picker">
                        <div class="field line-field">
                            <div class="label">出发线路</div>
                            <select class="input" id="fare-start-line"></select>
                            <input class="input line-summary" id="fare-start-line-summary" type="text" readonly hidden>
                        </div>
                        <div class="field combo-field">
                            <div class="label">出发站</div>
                            <div class="combo-shell">
                                <input class="input" id="fare-start" placeholder="输入或选择站点" autocomplete="off">
                                <div class="combo-menu" id="fare-start-menu"></div>
                            </div>
                        </div>
                    </section>
                    <section class="journey-card station-picker" style="margin-top:10px;">
                        <div class="field line-field">
                            <div class="label">目的线路</div>
                            <select class="input" id="fare-end-line"></select>
                            <input class="input line-summary" id="fare-end-line-summary" type="text" readonly hidden>
                        </div>
                        <div class="field combo-field">
                            <div class="label">目的站</div>
                            <div class="combo-shell">
                                <input class="input" id="fare-end" placeholder="输入或选择站点" autocomplete="off">
                                <div class="combo-menu" id="fare-end-menu"></div>
                            </div>
                        </div>
                    </section>
                    <div class="grid" style="margin-top:10px;">
                        <div class="field">
                            <div class="label">乘客类型</div>
                            <select class="input" id="fare-passenger">
                                <option value="adult">成人</option>
                                <option value="student">学生</option>
                                <option value="concession">优惠</option>
                            </select>
                        </div>
                        <div class="field">
                            <div class="label">出行时段</div>
                            <select class="input" id="fare-period">
                                <option value="normal">常规</option>
                                <option value="offpeak">非高峰</option>
                            </select>
                        </div>
                    </div>
                    <div class="fare-actions">
                        <button class="btn btn-primary" id="fare-calc" type="button">测算</button>
                        <button class="btn btn-ghost" id="fare-swap" type="button">交换</button>
                    </div>
                </div>
            </section>

            <section class="tool-panel">
                <div class="tool-panel-body">
                    <div id="fare-output">
                        <section class="empty-state compact-empty-state">
                            <div class="empty-state-mark" aria-hidden="true"></div>
                            <h2>选择两个站点测算</h2>
                            <p>结果会同时给出估算票价、路径距离、换乘次数和推荐路径。</p>
                        </section>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script defer src="src/ui.js"></script>
    <script defer src="src/transitApi.js"></script>
    <script defer src="src/timetableLoader.js"></script>
    <script defer src="src/transitData.js"></script>
    <script defer src="src/fareCalculator.js"></script>
</body>
</html>
