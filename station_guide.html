<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站点导览</title>
    <link rel="stylesheet" href="style/styles.css">
    <style>
        .guide-shell {
            width: min(1120px, 100%);
            display: grid;
            grid-template-columns: 360px minmax(0, 1fr);
            gap: 14px;
        }

        .guide-list {
            display: grid;
            gap: 8px;
            margin-top: 12px;
            max-height: calc(100vh - 290px);
            overflow: auto;
            padding-right: 4px;
        }

        .station-row {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            padding: 10px 12px;
            cursor: pointer;
            text-align: left;
        }

        .station-row.is-selected,
        .station-row:hover {
            border-color: rgba(26, 115, 232, 0.45);
            box-shadow: 0 1px 3px rgba(60, 64, 67, 0.2);
        }

        .station-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-top: 14px;
        }

        .station-tile {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            padding: 12px;
        }

        .detail-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 14px;
        }

        .line-row-name {
            color: var(--text);
            font-weight: 500;
        }

        .line-row-meta {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 3px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: 500;
            line-height: 1.1;
        }

        .metric-value.compact {
            font-size: 14px;
            line-height: 1.45;
            font-weight: 650;
        }

        .metric-label {
            margin-top: 4px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .neighbor-list,
        .line-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .recent-card {
            margin-top: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.74);
        }

        .station-source-panel {
            margin-top: 16px;
            padding: 14px;
            border: 1px solid rgba(26, 115, 232, 0.18);
            border-radius: 16px;
            background:
                radial-gradient(circle at 10% 0%, rgba(66, 133, 244, 0.12), transparent 34%),
                linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(248, 250, 255, 0.9));
        }

        .source-panel-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .section-title {
            margin: 0 0 4px;
            font-size: 18px;
        }

        .guide-map-card {
            display: grid;
            gap: 8px;
            margin: 10px 0 12px;
            color: inherit;
            text-decoration: none;
        }

        .guide-map-card img {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: #fff;
        }

        .station-fact-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .station-note {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(251, 188, 5, 0.14);
            color: #5f4300;
            font-size: 13px;
        }

        .source-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        @media (max-width: 900px) {
            .guide-shell,
            .station-grid,
            .station-fact-grid {
                grid-template-columns: 1fr;
            }

            .source-panel-head {
                display: grid;
            }
        }
    </style>
</head>
<body style="background-image: url('station.png');">
    <div class="page">
        <div class="topbar">
            <div class="brand">
                <div class="brand-title">站点导览</div>
                <div class="brand-subtitle">换乘 · 相邻站 · 首末班</div>
            </div>
            <div class="topbar-actions">
                <a class="btn btn-ghost" href="fare_calculator.html">票价测算</a>
                <a class="btn btn-ghost" href="index.html">返回首页</a>
            </div>
        </div>

        <div class="guide-shell">
            <section class="card">
                <div class="card-body">
                    <section class="journey-card station-picker" style="grid-template-columns:1fr;">
                        <div class="field line-field">
                            <div class="label">线路</div>
                            <select class="input" id="station-guide-line"></select>
                            <input class="input line-summary" id="station-guide-line-summary" type="text" readonly hidden>
                        </div>
                        <div class="field combo-field">
                            <div class="label">站点</div>
                            <div class="combo-shell">
                                <input class="input" id="station-guide-search" type="search" placeholder="输入或选择站点" autocomplete="off">
                                <div class="combo-menu" id="station-guide-menu"></div>
                            </div>
                        </div>
                    </section>
                    <div class="recent-card">
                        <div class="section-heading-inline"><div class="label">最近查看</div><span id="station-guide-count" class="status-chip">-- 个站点</span></div>
                        <div class="line-badges" id="station-guide-recent"></div>
                    </div>
                    <div class="guide-list" id="station-guide-list"></div>
                </div>
            </section>

            <section class="card">
                <div class="card-body">
                    <div id="station-guide-detail" class="muted">加载中</div>
                </div>
            </section>
        </div>
    </div>

    <script defer src="src/ui.js"></script>
    <script defer src="src/transitApi.js"></script>
    <script defer src="src/timetableLoader.js"></script>
    <script defer src="src/transitData.js"></script>
    <script defer src="src/stationGuide.js"></script>
</body>
</html>
