<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北京地铁线路图</title>
    <link rel="stylesheet" href="style/styles.css">
    <style>
        body::before {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.52), rgba(255, 255, 255, 0.74)),
                radial-gradient(900px 420px at 12% 0%, rgba(0, 109, 119, 0.14), transparent 60%),
                radial-gradient(900px 420px at 88% 0%, rgba(215, 38, 61, 0.12), transparent 60%);
        }

        .map-shell {
            width: min(1360px, 100%);
            flex: 1;
            display: grid;
            grid-template-columns: 330px minmax(0, 1fr);
            gap: 14px;
            min-height: calc(100vh - 104px);
        }

        .map-side {
            display: grid;
            align-content: start;
            gap: 12px;
        }

        .map-card {
            position: relative;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.82);
            box-shadow: var(--shadow);
            overflow: hidden;
            backdrop-filter: blur(12px);
        }

        .map-viewport {
            position: relative;
            height: calc(100vh - 106px);
            min-height: 640px;
            overflow: hidden;
            touch-action: none;
            background:
                linear-gradient(rgba(0, 109, 119, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 109, 119, 0.05) 1px, transparent 1px),
                rgba(255, 255, 255, 0.68);
            background-size: 36px 36px;
        }

        #viewportTransform {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            transform-origin: 0 0;
            cursor: grab;
            will-change: transform;
        }

        #viewportTransform.dragging {
            cursor: grabbing;
        }

        #subwayMap {
            width: min(1280px, 96vw);
            height: min(880px, 92vh);
            filter: drop-shadow(0 10px 18px rgba(36, 49, 64, 0.2));
            user-select: none;
        }

        #subwayMap svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .map-toolbar {
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            pointer-events: none;
            z-index: 3;
        }

        .map-toolbar > div {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            pointer-events: auto;
        }

        .map-tooltip {
            position: fixed;
            min-width: 250px;
            max-width: 330px;
            border: 1px solid rgba(36, 49, 64, 0.14);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 20px 48px rgba(26, 39, 52, 0.22);
            padding: 12px;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
            transform: translate(12px, 12px) scale(0.98);
            transition: opacity 120ms ease, transform 120ms ease;
        }

        .map-tooltip.is-on {
            opacity: 1;
            transform: translate(12px, 12px) scale(1);
        }

        .tooltip-title {
            font-weight: 800;
            margin-bottom: 8px;
        }

        .arrival-line {
            display: grid;
            gap: 4px;
            padding: 8px 0;
            border-top: 1px solid rgba(36, 49, 64, 0.1);
            font-size: 13px;
        }

        .map-side-card {
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .station-hit {
            cursor: pointer;
            transition: filter 120ms ease, opacity 120ms ease;
        }

        .station-hit.is-hovered {
            filter: drop-shadow(0 0 6px rgba(215, 38, 61, 0.75));
            opacity: 1;
        }

        @media (max-width: 960px) {
            .map-shell {
                grid-template-columns: 1fr;
            }

            .map-viewport {
                height: 70vh;
                min-height: 520px;
            }
        }
    </style>
</head>
<body>
    <div class="page" style="width:min(1420px, calc(100% - 24px)); padding-top:18px;">
        <div class="topbar">
            <div class="brand">
                <div class="brand-title">北京地铁线路图</div>
                <div class="brand-subtitle">大图浏览 · 站点悬浮 · 下一班车查询</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <a class="btn btn-ghost" href="query.html">线路查询</a>
                <a class="btn btn-ghost" href="index.html">返回首页</a>
            </div>
        </div>

        <main class="map-shell">
            <aside class="map-side">
                <section class="map-side-card">
                    <div class="field combo-field">
                        <div class="label">站点查询</div>
                        <div class="combo-shell">
                            <input class="input" id="map-station-search" list="map-station-list" placeholder="输入中文站名查看下一班车" autocomplete="off">
                        </div>
                        <datalist id="map-station-list"></datalist>
                    </div>
                    <div id="map-station-panel" class="route-path-card muted" style="margin-top:12px;">数据加载中</div>
                </section>

                <section class="map-side-card">
                    <div class="pill">浏览控制</div>
                    <div class="grid">
                        <button class="btn btn-primary" type="button" id="zoomInBtn">放大</button>
                        <button class="btn btn-primary" type="button" id="zoomOutBtn">缩小</button>
                        <button class="btn btn-ghost" type="button" id="resetBtn">重置</button>
                    </div>
                    <p class="subtitle">触控板双指平移、按住 Ctrl/⌘ 滚动缩放、双击放大；按住 Shift 可临时拖动画布。</p>
                </section>
            </aside>

            <section class="map-card">
                <div class="map-viewport" id="mapViewport" aria-label="地铁线路图查看器">
                    <div id="viewportTransform">
                        <div id="subwayMap" aria-live="polite"></div>
                    </div>

                    <div class="map-toolbar">
                        <div>
                            <div class="pill">缩放：<span id="zoomLabel">100%</span></div>
                            <div class="pill">可悬浮站点：<span id="hoverStationCount">-</span></div>
                        </div>
                        <div>
                            <a class="btn btn-ghost" href="Beijing_Subway_System_Map.svg" download>下载 SVG</a>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div class="map-tooltip" id="map-tooltip"></div>

    <script defer src="src/ui.js"></script>
    <script defer src="src/timetableLoader.js"></script>
    <script defer src="src/mapExplorer.js"></script>
</body>
</html>
