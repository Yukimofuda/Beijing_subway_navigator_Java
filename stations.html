<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>站点与线路信息</title>
    <link rel="stylesheet" href="style/styles.css">

<body style="background-image: url('station.png');">
    <div class="page">
        <div class="topbar">

                <div class="brand-title">线路与站点</div>
                <div class="brand-subtitle">站点顺序 · 区间信息</div>

            <div style="display:flex; align-items:center; gap:10px;">

    <script defer src="src/ui.js"></script>
    <script defer src="src/transitApi.js"></script>
