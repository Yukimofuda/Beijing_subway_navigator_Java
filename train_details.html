<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车次详细信息</title>
    <link rel="stylesheet" href="style/styles.css">
    <link rel="stylesheet" href="style/product-apple.css">
</head>
<body>
    <div class="page">
        <div class="topbar">
            <div class="brand">
                <div class="brand-title">车次详细信息</div>
                <div class="brand-subtitle">站点 · 到发时刻</div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <a class="btn btn-ghost" href="lines.html">返回线路</a>
                <a class="btn btn-ghost" id="back-to-trains" href="trains.html">返回车次列表</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <div id="train-details" class="muted">加载中...</div>
            </div>
        </div>
    </div>

    <script defer src="src/ui.js"></script>
    <script defer src="src/transitApi.js"></script>
    <script defer src="src/timetableLoader.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const detailsContainer = document.getElementById('train-details');
            const backToTrains = document.getElementById('back-to-trains');
            
            // 获取 URL 中的参数 line 和 train
            const urlParams = new URLSearchParams(window.location.search);
            const line = urlParams.get('line');
            const train = urlParams.get('train');
            if (backToTrains) {
                backToTrains.href = line ? `trains.html?line=${encodeURIComponent(line)}` : 'trains.html';
            }

            // 从 timetable.json 获取数据
            loadTimetableData()
                .then(data => {
                    let trainDetails = null;

                    // 遍历 timetable.json 数据，找到匹配的车次
                    for (const dayType in data) {
                        if (data.hasOwnProperty(dayType)) {
                            for (const currentLine in data[dayType]) {
                                if (data[dayType].hasOwnProperty(currentLine)) {
                                    if (currentLine === line) {
                                        for (const direction in data[dayType][currentLine]) {
                                            if (data[dayType][currentLine].hasOwnProperty(direction)) {
                                                for (const trainInfo in data[dayType][currentLine][direction]) {
                                                    if (trainInfo === train) {
                                                        // 找到匹配的车次，保存其详细信息
                                                        trainDetails = data[dayType][currentLine][direction][trainInfo];
                                                        break;
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }

                    // 显示车次详细信息
                    if (trainDetails) {
                        const table = document.createElement('table');
                        let html = `
                            <tr>
                                <th>站点</th>
                                <th>时刻</th>
                            </tr>
                        `;
                        trainDetails.forEach(stationInfo => {
                            html += `
                                <tr>
                                    <td>${stationInfo[0]}</td>
                                    <td>${stationInfo[1]}</td>
                                </tr>
                            `;
                        });
                        table.innerHTML = html;
                        detailsContainer.innerHTML = '';  // 清空加载中提示
                        detailsContainer.appendChild(table);  // 添加车次表格
                    } else {
                        detailsContainer.innerHTML = '<div class="no-details">未找到该车次的详细信息。</div>';
                    }
                })
                .catch(error => console.error('加载车次信息失败:', error));
        });
    </script>
</body>
</html>
