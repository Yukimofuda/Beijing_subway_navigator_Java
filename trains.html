<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>车次选择</title>
  <link rel="stylesheet" href="style/styles.css">
  <link rel="stylesheet" href="style/product-apple.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="brand-title">车次选择</div>
        <div class="brand-subtitle">当前线路：<span id="current-line" class="muted">-</span></div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <a class="btn btn-ghost" href="lines.html">返回线路选择</a>
        <a class="btn btn-ghost" href="index.html">返回首页</a>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="transit-page-heading">
          <span class="transit-heading-symbol" aria-hidden="true"><svg viewBox="0 0 48 48"><rect x="12" y="5" width="24" height="32" rx="7"/><path d="M12 20h24M19 5v15M13 43l6-6m16 6-6-6M18 29h2m8 0h2"/></svg></span>
          <div><span class="section-kicker">DEPARTURES</span><h1 class="title">车次一览</h1></div>
        </div>
        <div class="list-toolbar train-list-toolbar">
          <label class="field" for="train-search">
            <span class="label">筛选车次</span>
            <input class="input" id="train-search" type="search" placeholder="输入车次号、方向或站点">
          </label>
          <span class="status-chip" id="train-count">数据加载中</span>
        </div>
        <div id="trains" class="train-catalog-grid" style="margin-top:16px;"></div>
        <button class="btn btn-ghost train-more" id="train-more" type="button" hidden>显示更多车次</button>
      </div>
    </div>
  </div>

  <script defer src="src/ui.js"></script>
  <script defer src="src/transitApi.js"></script>
  <script defer src="src/transitData.js"></script>
  <script defer src="src/timetableLoader.js"></script>
  <script defer src="src/trains.js"></script>
</body>
</html>
